{% extends "base_admin.html" %}

{% block title %}{{ title }} — ERMAK Admin{% endblock %}

{% block content %}
<h1 class="admin-section-title">{{ title }}</h1>

<form method="POST" class="admin-form">
  {{ form.hidden_tag() }}
  <div>
    {{ form.name.label }}
    {{ form.name }}
  </div>
  <div>
    {{ form.sort_order.label }}
    {{ form.sort_order }}
  </div>
  <button type="submit" class="admin-btn">Сохранить</button>
  <a class="admin-btn" href="{{ url_for('admin_categories') }}" style="background:#2A2A2A; color:#A8A8A8;">Отмена</a>
</form>
{% endblock %}
